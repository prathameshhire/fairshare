<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Gradient identical to the LogoMark component: green-500 → emerald-600 -->
  <defs>
    <linearGradient id="fairshare-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square fills the whole favicon -->
  <rect width="32" height="32" rx="7" fill="url(#fairshare-bg)"/>

  <!-- Two overlapping rounded squares — the "shared" mark.
       Slightly larger and bolder than the LogoMark's inner svg to stay
       legible at 16x16 (browser tab) render size. -->
  <rect x="5" y="9" width="13" height="14" rx="3" fill="white" fill-opacity="0.78"/>
  <rect x="14" y="9" width="13" height="14" rx="3" fill="white" fill-opacity="0.78"/>
</svg>
